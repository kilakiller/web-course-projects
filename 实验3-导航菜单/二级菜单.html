<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>二级水平导航菜单</title>
    <style>
        /* ========== 基础 ========== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: "Microsoft YaHei", "PingFang SC", sans-serif;
            background-color: #fafaf7;          /* 米白纸底 */
            color: #1c1c1e;
        }

        ul { list-style: none; }

        /* ========== 顶部深蓝工具条（沿用官网语言） ========== */
        .utility-bar {
            background-color: #1e3d8f;
            color: rgba(255, 255, 255, 0.85);
            font-size: 13px;
        }

        .utility-bar .inner {
            max-width: 1160px;
            margin: 0 auto;
            padding: 7px 16px;
            display: flex;
            justify-content: space-between;
        }

        .utility-bar a {
            color: rgba(255, 255, 255, 0.85);
            text-decoration: none;
            margin-left: 22px;
        }

        .utility-bar a:hover {
            color: #ffffff;
            text-decoration: underline;
        }

        /* ========== 校名区 ========== */
        .brand {
            max-width: 1160px;
            margin: 0 auto;
            padding: 34px 16px 30px;
            display: flex;
            align-items: center;
            gap: 20px;
        }

        /* 朱文印章：本页的记忆点 */
        .seal {
            flex: none;
            width: 64px;
            height: 64px;
            background-color: #a3050f;
            border-radius: 6px;
            display: grid;
            grid-template-columns: 1fr 1fr;
            grid-template-rows: 1fr 1fr;
            place-items: center;
            color: #ffffff;
            font-family: "KaiTi", "STKaiti", serif;
            font-size: 24px;
            font-weight: bold;
            line-height: 1;
            box-shadow: 0 3px 10px rgba(163, 5, 15, 0.28);
        }

        .brand h1 {
            font-family: "SimSun", "STSong", serif;       /* 衬线校名，呼应书法校名 */
            font-size: 34px;
            font-weight: bold;
            letter-spacing: 6px;
            color: #a3050f;
            line-height: 1.2;
        }

        .brand .en {
            margin-top: 4px;
            font-family: Georgia, "Times New Roman", serif;
            font-style: italic;
            font-size: 12px;
            letter-spacing: 1px;
            color: #9a9a92;
        }

        /* ========== 导航条（白底通栏 + 红色强调） ========== */
        .nav {
            background-color: #ffffff;
            border-top: 1px solid #e5e2da;
            border-bottom: 1px solid #e5e2da;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .nav .menu {
            max-width: 1160px;
            margin: 0 auto;
            display: flex;
            justify-content: center;
        }

        .nav .menu > li {
            position: relative;               /* 二级菜单定位参照 */
        }

        .nav .menu > li > a {
            display: block;
            position: relative;
            padding: 16px 24px 14px;
            font-size: 16px;
            color: #1c1c1e;
            text-decoration: none;
            white-space: nowrap;
            transition: color .15s ease;
        }

        /* 红色下划线：从左侧生长（而不是居中对开），呼应印章的"落笔" */
        .nav .menu > li > a::after {
            content: "";
            position: absolute;
            left: 24px;
            bottom: 0;
            width: 0;
            height: 3px;
            background-color: #a3050f;
            transition: width .18s ease;
        }

        .nav .menu > li:hover > a {
            color: #a3050f;
        }

        .nav .menu > li:hover > a::after {
            width: calc(100% - 48px);
        }

        /* ========== 二级下拉菜单 ========== */
        .nav .menu > li > ul {
            position: absolute;
            top: 100%;
            left: 50%;
            transform: translateX(-50%) translateY(6px);
            min-width: 230px;
            background-color: #ffffff;
            border: 1px solid #e5e2da;
            border-top: 3px solid #a3050f;    /* 红头：和导航下划线同一支笔 */
            box-shadow: 0 10px 26px rgba(28, 28, 30, 0.10);
            opacity: 0;
            visibility: hidden;
            transition: opacity .16s ease, transform .16s ease, visibility .16s;
        }

        .nav .menu > li > ul li {
            border-bottom: 1px solid #f2f0ea;
        }

        .nav .menu > li > ul li:last-child {
            border-bottom: none;
        }

        .nav .menu > li > ul li a {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 13px 18px;
            font-size: 14px;
            color: #3a3a3d;
            text-decoration: none;
            white-space: nowrap;
            transition: background-color .15s ease, color .15s ease;
        }

        .nav .menu > li > ul li a::after {
            content: "›";
            color: #c9c6bd;
            transition: color .15s ease, transform .15s ease;
        }

        .nav .menu > li > ul li a:hover {
            background-color: #f9f2f2;        /* 极浅的校红底色 */
            color: #a3050f;
        }

        .nav .menu > li > ul li a:hover::after {
            color: #a3050f;
            transform: translateX(3px);
        }

        .nav .menu > li:hover > ul {
            opacity: 1;
            visibility: visible;
            transform: translateX(-50%) translateY(0);
        }

        /* ========== 页脚说明 ========== */
        .footnote {
            max-width: 1160px;
            margin: 90px auto 40px;
            padding: 0 16px;
            color: #9a9a92;
            font-size: 13px;
            text-align: center;
            line-height: 1.9;
        }

        .footnote strong { color: #a3050f; font-weight: normal; }
    </style>
</head>
<body>
    <!-- 顶部深蓝工具条 -->
    <div class="utility-bar">
        <div class="inner">
            <span>欢迎访问湖南文理学院</span>
            <span>
                <a href="#">旧版入口</a>
                <a href="#">信息门户</a>
                <a href="#">校园邮箱</a>
            </span>
        </div>
    </div>

    <!-- 校名区 -->
    <header class="brand">
        <div class="seal" aria-hidden="true">
            <span>湖</span><span>南</span><span>文</span><span>理</span>
        </div>
        <div>
            <h1>湖南文理学院</h1>
            <div class="en">Hunan University of Arts and Science</div>
        </div>
    </header>

    <!-- 二级水平导航菜单 -->
    <nav class="nav">
        <ul class="menu">
            <li><a href="#">首页</a></li>
            <li><a href="#">教学院(部)</a>
                <ul>
                    <li><a href="#">计算机与电气工程学院</a></li>
                    <li><a href="#">芙蓉学院</a></li>
                </ul>
            </li>
            <li><a href="#">党群机构</a></li>
            <li><a href="#">行政教辅机构</a></li>
            <li><a href="#">教学科研</a></li>
            <li><a href="#">招生就业</a></li>
            <li><a href="#">国际交流</a></li>
            <li><a href="#">数字图书馆</a></li>
        </ul>
    </nav>

    <div class="footnote">
        悬停 <strong>教学院(部)</strong> 查看二级下拉菜单
    </div>
</body>
</html>
